# Gradle 配置（参考旧项目 v0.5 已验证组合）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Android 配置
android.useAndroidX=true
android.nonTransitiveRClass=true
# 允许项目路径包含非 ASCII 字符（中文路径兼容：本机路径 F:\Trae AI\... 含中文）
android.overridePathCheck=true

# 修复 Kotlin 2.0.20 + AGP 8.7.0 的 "Current thread does not hold the state lock" 错误
kotlin.compiler.execution.strategy=in-process

# 本机仅装 android-36，AGP 8.7.0 官方最高测试到 35，显式抑制编译级别警告（与 v0.5 一致）
android.suppressUnsupportedCompileSdk=36