# Gradle 配置（参考旧项目 v0.5 已验证组合）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Android 配置
android.useAndroidX=true
android.nonTransitiveRClass=true
# 允许项目路径包含非 ASCII 字符（中文路径兼容：本机路径 F:\Trae AI\... 含中文）
android.overridePathCheck=true

# 本机仅装 android-36，AGP 8.7.0 官方最高测试到 35，显式抑制编译级别警告（与 v0.5 一致）
android.suppressUnsupportedCompileSdk=36

# Room 注释处理器走 KSP1（Kotlin 2.0.20 + KSP 2.0.20-1.0.25）。曾遇 kapt/KSP2 均报 MissingType：实际根因是 AppDatabase 漏 import WorldInfoDao，
# 与处理器/版本无关（已补 import 后三者皆通）。KSP2 触发 Kotlin 2.0.20 的 PSI 变更 BUG，故固定用 KSP1。
ksp.useKSP2=false
# 本机梯子代理（Clash 混合端口 7890）：让 gradle 走代理下载/解析依赖（DNS 由代理处理，可解析 dl.google.com 等被墙源）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890