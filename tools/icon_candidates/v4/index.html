<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>EdenCourt 图标 v4 · 水晶樱羽（专家定稿）</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background:#f6f4fb; margin:0; padding:32px; }
  h1 { font-size:22px; color:#5b5b7a; text-align:center; margin-bottom:6px; }
  .sub { text-align:center; color:#9a9ab0; font-size:13px; margin-bottom:28px; }
  .row { display:flex; gap:40px; justify-content:center; flex-wrap:wrap; }
  .card { background:#fff; border-radius:16px; padding:24px 24px 18px; width:320px;
          box-shadow:0 4px 18px rgba(120,110,180,.10); text-align:center; }
  .card img { width:260px; height:260px; margin-bottom:8px;
              box-shadow:0 4px 14px rgba(0,0,0,.12); }
  .card img.round { border-radius:50%; }
  .card h3 { font-size:16px; color:#4a4a6a; margin:10px 0 4px; }
  .card p { font-size:13px; color:#8a8aa4; margin:0; }
</style>
</head>
<body>
  <h1>💎 v4 水晶樱羽 · 樱花雨版</h1>
  <div class="sub">水晶棱面花瓣 + 香槟金描边 + 珍珠花蕊 + 星芒 + 间隙光羽 + 樱花雨白点</div>
  <div class="row">
    <div class="card">
      <img src="v4_rounded.png" alt="圆角方形">
      <h3>圆角方形</h3>
      <p>默认启动器样式</p>
    </div>
    <div class="card">
      <img src="v4_round.png" alt="圆形" class="round">
      <h3>圆形</h3>
      <p>部分启动器圆形裁切</p>
    </div>
  </div>
</body>
</html>
